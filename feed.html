<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>推しフィード</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#120f1a;color:#f4f0fa;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 10px 10px;overflow-x:auto;background:linear-gradient(#120f1aee,#120f1a00)}
.chip{flex:none;border:1px solid #ffffff33;background:#ffffff14;color:inherit;border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:#ff6fae;border-color:#ff6fae;color:#1a0b14}
#feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain}
.slide{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding:calc(54px + env(safe-area-inset-top)) 0 env(safe-area-inset-bottom)}
.media{position:relative;flex:1;min-height:0;margin:0 8px;border-radius:14px;overflow:hidden;background:#000 center/cover no-repeat}
.media.x{background:linear-gradient(160deg,#2a1d3d,#14202f);display:grid;place-items:center;color:#ffffffaa;font-size:14px}
.live{position:absolute;inset:0;overflow-y:auto}
.live iframe{width:100%;height:100%;border:0}
.cap{padding:10px 14px 14px;display:flex;flex-direction:column;gap:2px}
.cap b{font-size:15px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap span{font-size:12px;opacity:.7}
.cap span[data-only]{text-decoration:underline;cursor:pointer}
#cmDlg{max-height:80dvh;overflow-y:auto;width:min(94vw,440px)}
.cmt{padding:10px 0;border-top:1px solid #ffffff22}.cmt b{font-size:13px}.cmt span{font-size:11px;opacity:.6;margin-left:8px}
.rep{margin-left:14px;border-top-color:#ffffff14}
.cmt p{font-size:14px;line-height:1.6;white-space:pre-wrap;margin-top:4px;overflow-wrap:anywhere}
.msg{padding:90px 20px;text-align:center;line-height:1.8;white-space:pre-wrap}
dialog{margin:auto;border:1px solid #ffffff33;border-radius:14px;background:#1d1829;color:inherit;padding:18px;width:min(92vw,380px)}
dialog::backdrop{background:#000a}
dialog label{display:block;font-size:13px;margin:10px 0 4px}
dialog input,dialog select,dialog textarea{font:inherit;width:100%;padding:9px;border-radius:8px;border:1px solid #ffffff33;background:#120f1a;color:inherit;font:inherit}
dialog .row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
</style>
</head>
<body>
<header id="bar"></header>
<main id="feed"></main>
<dialog id="cmDlg">
  <div class="row" style="justify-content:space-between;margin:0 0 10px;position:sticky;top:0">
    <div><button class="chip" data-s="relevance" aria-pressed="true">人気順</button> <button class="chip" data-s="time" aria-pressed="false">新しい順</button></div>
    <button class="chip" id="cmClose">閉じる</button>
  </div>
  <div id="cmList"></div>
</dialog>
<dialog id="qDlg">
  <form method="dialog" id="qForm">
    <label for="qVal">YouTubeを検索</label>
    <input id="qVal" autocomplete="off" placeholder="例：あいす ライブ">
    <div class="row"><button class="chip" value="cancel">閉じる</button><button class="chip" value="ok" aria-pressed="true">検索</button></div>
  </form>
</dialog>
<dialog id="pickDlg">
  <form method="dialog" id="pickForm">
    <label for="pickSel">このアカウントだけ見る</label>
    <select id="pickSel"></select>
    <div class="row"><button class="chip" value="cancel">閉じる</button><button class="chip" value="ok" aria-pressed="true">表示</button></div>
  </form>
</dialog>
<dialog id="dlg">
  <form method="dialog" id="addForm">
    <label for="addType">追加するもの</label>
    <select id="addType">
      <option value="yv">YouTube動画・ライブのURL（リンクを貼る）</option>
      <option value="yt">YouTubeチャンネル（@ハンドル）</option>
      <option value="xp">Xの投稿URL</option>
      <option value="ig">Instagramの投稿URL</option>
    </select>
    <label for="addVal">@ハンドル または URL（まとめて貼り付けOK）</label>
    <textarea id="addVal" rows="4" autocomplete="off" placeholder="投稿のリンクは、改行で並べてまとめて貼り付けられます"></textarea>
    <label for="keyVal">YouTube APIキー（変更するときだけ）</label>
    <input id="keyVal" autocomplete="off">
    <div class="row"><button class="chip" value="cancel">閉じる</button><button class="chip" id="addBtn" value="ok" aria-pressed="true">追加</button></div>
  </form>
</dialog>

<script>
/* ===== 設定：ここに足せば増えます（画面の「＋追加」からも追加できます） ===== */
const CONFIG = {
  API_KEY: "",          // YouTube Data API v3 のキー。空なら起動時に入力を求めます
  PER_CHANNEL: 5,       // 1チャンネルあたり取る新着の本数
  YT: [
    "@iLiFE_official","@あいらいふ","@ice-iLiFE","@りりたんちゃんねる","@ilife-_-otaku","@BabyiLiFE",
    "@iON-HEROINES","@iMiN-HEROINES","@heroinesofficial","@imin_fan","@福本カレン","@megafon_idol","@icecolne",
    "@ULmelon","@chan_maru7","@B_Fullest","@sugaisan","@RIDDLER_nazo","@daidophenixtokai","@toyodagosei-bluefalcon",
    "@tomikyowakoku","@JPNhandball","@TomiVideo","@100yengoraku","@deisuigames","@しゃけごはん-i8i",
    "@tsukubahandball1989","@QuizKnock","@oi_ken","@klassekawachan","@bykn","@_taiyaki_4646","@keikich",
    "@ZeekstarTokyo","@2zicon","@KK-uy6zs","@DougaJidai","@LeagueH_handball","@inazuma0217tai1","@TigerFireee",
    "@Harukiyo","@buyuriru","@zagou-new","@Pols","@medansy","@Yuyuch7676","@Yuukun3798"
  ],
  X_ACCOUNTS: [],      // アカウントのタイムライン表示は不安定なので、今は使いません
  X_POSTS: [],          // 例: "https://x.com/iLiFE_official/status/1234567890"
  IG_POSTS: []          // 例: "https://www.instagram.com/p/XXXXXXXX/"
};
/* ======================================================================= */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rd = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const wr = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

let extra = Object.assign({yv:[],yt:[],xa:[],xp:[],ig:[]}, rd('extra') || {});
let key = CONFIG.API_KEY || rd('key') || '';
const st = Object.assign({src:'all', shorts:false, order:'mix'}, rd('st') || {}, {only:'', q:'', onlyLabel:''});
let items = [], active = -1;

/* ---------- YouTube ---------- */
async function api(path, params) {
  const u = new URL('https://www.googleapis.com/youtube/v3/' + path);
  u.search = new URLSearchParams({...params, key});
  const r = await fetch(u);
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error?.message || r.status); }
  return r.json();
}
async function uploadsId(h) {
  if (h.startsWith('UC')) return 'UU' + h.slice(2);
  const c = rd('pl') || {};
  if (c[h]) return c[h];
  const j = await api('channels', {part:'contentDetails', forHandle:h});
  const id = j.items?.[0]?.contentDetails?.relatedPlaylists?.uploads;
  if (!id) throw new Error('見つかりません');
  c[h] = id; wr('pl', c);
  return id;
}
async function ytItems(h, n) {
  let id = await uploadsId(h);
  if (st.shorts) id = 'UUSH' + id.slice(2);
  const j = await api('playlistItems', {part:'snippet,contentDetails', playlistId:id, maxResults:n || CONFIG.PER_CHANNEL});
  return (j.items || []).map(i => ({t:'yt', id:i.contentDetails.videoId, title:i.snippet.title,
    h, ch:i.snippet.videoOwnerChannelTitle || h, date:i.contentDetails.videoPublishedAt || i.snippet.publishedAt || ''}));
}

const dec = t => { const e = document.createElement('textarea'); e.innerHTML = t; return e.value; };
async function ytSearch(q) {
  const p = {part:'snippet', type:'video', q, maxResults:50, videoEmbeddable:'true', regionCode:'JP', relevanceLanguage:'ja', order: st.order === 'new' ? 'date' : 'relevance'};
  if (st.shorts) p.videoDuration = 'short';
  const j = await api('search', p);
  return (j.items || []).map(i => ({t:'yt', id:i.id.videoId, title:dec(i.snippet.title), h:i.snippet.channelId, ch:dec(i.snippet.channelTitle), date:i.snippet.publishedAt}));
}

const ytId = s => { const m = s.match(/(?:[?&]v=|youtu\.be\/|\/live\/|\/shorts\/|\/embed\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(s) ? s : ''); };

/* ---------- 読み込みと並び替え ---------- */
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

async function load() {
  const feed = $('#feed'); feed.innerHTML = '<p class="msg">読み込み中…</p>';
  const q = st.q, all = st.src === 'all', one = q ? '' : st.only, errs = []; items = [];
  let pins = [];
  if (!one && !q && (all || st.src === 'yt') && extra.yv.length) {
    pins = extra.yv.slice(-50).reverse().map(id => ({t:'yt', id, title:'YouTube', h:'', ch:'', date:''}));
    if (key) { try {
      const j = await api('videos', {part:'snippet', id:pins.map(x => x.id).join(',')});
      (j.items || []).forEach(v => { const p = pins.find(x => x.id === v.id); if (!p) return;
        const lb = v.snippet.liveBroadcastContent;
        p.title = (lb === 'live' ? '🔴ライブ中 ' : lb === 'upcoming' ? '⏰配信予定 ' : '') + v.snippet.title;
        p.h = v.snippet.channelId; p.ch = v.snippet.channelTitle; });
    } catch (e) {} }
  }
  if (q || (one ? one.startsWith('yt:') : (all || st.src === 'yt'))) {
    if (!key && !pins.length) {
      feed.innerHTML = '<div class="msg"><p>YouTubeのAPIキーを貼り付けて、保存を押してください</p><br><input id="k1" autocomplete="off" placeholder="AIza..." style="width:100%;padding:10px;border-radius:8px;border:1px solid #ffffff55;background:#1d1829;color:inherit;font:inherit"><br><br><button class="chip" id="k2" aria-pressed="true">保存</button></div>';
      $('#k2').onclick = () => { const v = $('#k1').value.trim(); if (v) { key = v; wr('key', v); load(); } };
      return;
    }
    if (q) { try { items = await ytSearch(q); } catch (e) { errs.push('検索：' + e.message); } }
    else if (key) {
      const hs = one ? [one.slice(3)] : [...new Set([...CONFIG.YT, ...extra.yt])];
      const rs = await Promise.allSettled(hs.map(h => ytItems(h, one ? 50 : CONFIG.PER_CHANNEL)));
      rs.forEach((r, i) => r.status === 'fulfilled' ? items.push(...r.value) : errs.push(hs[i] + '：' + r.reason.message));
    }
    const seen = new Set(pins.map(x => x.id)); items = items.filter(x => !seen.has(x.id) && seen.add(x.id));
  }
  if (one && one.startsWith('x:')) items.push({t:'xa', h:one.slice(2)});
  else if (!one && !q && (all || st.src === 'x')) {
    [...CONFIG.X_ACCOUNTS, ...extra.xa].forEach(h => items.push({t:'xa', h}));
    [...CONFIG.X_POSTS, ...extra.xp].forEach(u => items.push({t:'xp', u}));
  }
  if (!one && !q && (all || st.src === 'ig')) [...CONFIG.IG_POSTS, ...extra.ig].forEach(u => items.push({t:'ig', u}));
  if (one || st.order === 'new') items.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  else shuffle(items);
  items = [...pins, ...items];
  render();
  if (errs.length) toast('取得できなかった項目：' + errs.length + '件\n' + errs.slice(0, 3).join('\n'));
}

function toast(t) { const p = document.createElement('p'); p.className = 'msg'; p.textContent = t; $('#feed').append(p); }

/* ---------- 表示 ---------- */
function render() {
  const feed = $('#feed');
  if (!items.length) { feed.innerHTML = '<p class="msg">表示できるものがありません。\n「＋追加」から追加するか、APIキーを確認してください。</p>'; return; }
  feed.innerHTML = items.map((it, i) => {
    let m, c;
    if (it.t === 'yt') { m = `<div class="media" style="background-image:url(https://i.ytimg.com/vi/${esc(it.id)}/hqdefault.jpg)"><div class="live"></div></div>`; c = `<b>${esc(it.title)}</b>${it.h ? `<span data-only="yt:${esc(it.h)}" data-label="${esc(it.ch)}">${esc(it.ch)}（タップでこのチャンネルだけ）</span>` : '<span>貼り付けたリンク</span>'}<button class="chip" data-cm="${esc(it.id)}" style="align-self:flex-start;margin-top:6px">コメントを見る</button>`; }
    else if (it.t === 'xa') { m = `<div class="media x"><div class="live"></div>@${esc(it.h)} のタイムラインを読み込み中</div>`; c = `<b>@${esc(it.h)}</b><span data-only="x:${esc(it.h)}" data-label="@${esc(it.h)}">X（タップでこのアカウントだけ）</span>`; }
    else if (it.t === 'xp') { m = `<div class="media x"><div class="live"></div>投稿を読み込み中</div>`; c = `<b>Xの投稿</b><span>X</span>`; }
    else { m = `<div class="media x"><div class="live"></div>投稿を読み込み中</div>`; c = `<b>Instagramの投稿</b><span>Instagram</span>`; }
    return `<section class="slide" data-i="${i}">${m}<div class="cap">${c}</div></section>`;
  }).join('');
  active = -1;
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) activate(+e.target.dataset.i); }), {root:feed, threshold:.6});
  feed.querySelectorAll('.slide').forEach(s => io.observe(s));
}

const scripts = {};
const loadJs = src => scripts[src] || (scripts[src] = new Promise((ok, ng) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = ok; s.onerror = () => { delete scripts[src]; ng(new Error('load')); }; document.head.append(s); }));

async function activate(i) {
  if (i === active) return;
  const old = document.querySelector(`.slide[data-i="${active}"] .live`); if (old) old.innerHTML = '';
  active = i;
  const it = items[i], live = document.querySelector(`.slide[data-i="${i}"] .live`);
  if (!live) return;
  try {
    if (it.t === 'yt') {
      live.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${esc(it.id)}?autoplay=1&mute=1&playsinline=1&rel=0&loop=1&playlist=${esc(it.id)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    } else if (it.t === 'xa' || it.t === 'xp') {
      await loadJs('https://platform.twitter.com/widgets.js');
      if (active !== i) return;
      if (it.t === 'xa') { if (!await twttr.widgets.createTimeline({sourceType:'profile', screenName:it.h}, live, {theme:'dark', chrome:'noheader nofooter transparent', height:Math.round(live.clientHeight) || 560})) throw 0; }
      else { const id = (it.u.match(/status\/(\d+)/) || [])[1]; if (!id || !await twttr.widgets.createTweet(id, live, {theme:'dark', align:'center'})) throw 0; }
    } else {
      live.innerHTML = `<blockquote class="instagram-media" data-instgrm-permalink="${esc(it.u)}" data-instgrm-version="14" style="width:100%;margin:0"></blockquote>`;
      await loadJs('https://www.instagram.com/embed.js');
      window.instgrm && instgrm.Embeds.process(live);
    }
  } catch (e) {
    const u = it.t === 'xa' ? 'https://x.com/' + encodeURIComponent(it.h) : (it.t === 'xp' && /^https?:/.test(it.u) ? it.u : '');
    live.innerHTML = '<p class="msg">読み込めませんでした' + (u ? '<br><br><a href="' + esc(u) + '" target="_blank" rel="noopener" style="color:#ff6fae">Xで開く</a>' : '') + '</p>';
  }
}

/* ---------- 操作バー ---------- */
function bar() {
  const b = (label, on, fn, id) => `<button class="chip" aria-pressed="${on}" data-f="${fn}">${label}</button>`;
  $('#bar').innerHTML =
    ['all:すべて','yt:YouTube','x:X','ig:Instagram'].map(s => { const [k, l] = s.split(':'); return b(l, st.src === k, 'src-' + k); }).join('') +
    b('ショートのみ', st.shorts, 'shorts') + b('シャッフル', st.order === 'mix', 'ord-mix') + b('新しい順', st.order === 'new', 'ord-new') +
    (st.q ? b('✕ 検索：' + esc(st.q), true, 'clearq') : b('検索', false, 'search')) +
    (st.only ? b('✕ ' + esc(st.onlyLabel || st.only) + ' だけ表示中', true, 'clear') : b('アカウント選択', false, 'pick')) +
    b('更新', false, 'reload') + b('＋追加', false, 'add');
}
$('#bar').addEventListener('click', e => {
  const f = e.target.dataset.f; if (!f) return;
  if (f.startsWith('src-')) st.src = f.slice(4);
  else if (f === 'shorts') st.shorts = !st.shorts;
  else if (f.startsWith('ord-')) st.order = f.slice(4);
  else if (f === 'search') { $('#qDlg').showModal(); $('#qVal').focus(); return; }
  else if (f === 'clearq') st.q = '';
  else if (f === 'add') { $('#dlg').showModal(); return; }
  else if (f === 'pick') { openPick(); return; }
  else if (f === 'clear') { st.only = ''; st.onlyLabel = ''; }
  wr('st', st); bar(); load();
});
$('#addForm').addEventListener('submit', e => {
  if (e.submitter?.value !== 'ok') return;
  const type = $('#addType').value; let v = $('#addVal').value.trim(); const k = $('#keyVal').value.trim();
  if (k) { key = k; wr('key', k); }
  if (v) {
    if (type === 'yv') { const ids = v.split(/\s+/).map(ytId).filter(Boolean); ids.forEach(x => { extra.yv = extra.yv.filter(y => y !== x); extra.yv.push(x); }); st.src = 'all'; st.only = ''; st.q = ''; wr('st', st); wr('extra', extra); $('#addVal').value = ''; $('#keyVal').value = ''; bar(); load(); return; }
    let vs = (type === 'xp' || type === 'ig') ? v.split(/\s+/).filter(x => /^https?:\/\//.test(x)).map(x => x.split('?')[0]) : [v];
    if (type === 'xp') vs = vs.filter(x => /status\/\d+/.test(x));
    if (type === 'yt') vs = vs.map(x => x.startsWith('@') ? x : '@' + x);
    vs.forEach(x => { if (!extra[type].includes(x)) extra[type].push(x); });
    wr('extra', extra);
  }
  $('#addVal').value = ''; $('#keyVal').value = ''; load();
});

function openPick() {
  const yt = [...new Set([...CONFIG.YT, ...extra.yt])], xa = [...CONFIG.X_ACCOUNTS, ...extra.xa];
  $('#pickSel').innerHTML = '<optgroup label="YouTube">' + yt.map(h => `<option value="yt:${esc(h)}">${esc(h)}</option>`).join('') + '</optgroup><optgroup label="X">' + xa.map(h => `<option value="x:${esc(h)}">@${esc(h)}</option>`).join('') + '</optgroup>';
  $('#pickDlg').showModal();
}
$('#pickForm').addEventListener('submit', e => {
  if (e.submitter?.value !== 'ok') return;
  st.only = $('#pickSel').value; st.onlyLabel = $('#pickSel').selectedOptions[0].textContent; st.q = ''; wr('st', st); bar(); load();
});
$('#feed').addEventListener('click', e => {
  const cmId = e.target.dataset?.cm; if (cmId) { openComments(cmId); return; }
  const o = e.target.dataset?.only; if (!o) return;
  st.only = o; st.onlyLabel = e.target.dataset.label || ''; st.q = ''; wr('st', st); bar(); load();
});

const cm = {id:'', sort:'relevance', token:''};
async function loadComments(more) {
  const box = $('#cmList');
  if (!more) { box.textContent = '読み込み中…'; cm.token = ''; }
  try {
    const j = await api('commentThreads', {part:'snippet', videoId:cm.id, maxResults:50, order:cm.sort, textFormat:'plainText', ...(cm.token ? {pageToken:cm.token} : {})});
    if (!more) box.innerHTML = '';
    box.querySelector('.more')?.remove();
    (j.items || []).forEach(t => {
      const c = t.snippet.topLevelComment.snippet, d = document.createElement('div'); d.className = 'cmt';
      d.innerHTML = `<b>${esc(c.authorDisplayName)}</b><span>${esc((c.publishedAt || '').slice(0, 10))}　♥${c.likeCount || 0}　返信${t.snippet.totalReplyCount || 0}</span><p>${esc(c.textDisplay)}</p>${t.snippet.totalReplyCount ? `<button class="chip" data-rp="${esc(t.id)}" data-label="返信${t.snippet.totalReplyCount}件を見る" style="margin-top:6px">返信${t.snippet.totalReplyCount}件を見る</button><div class="rps"></div>` : ''}`;
      box.append(d);
    });
    if (!box.children.length) box.textContent = 'コメントはありません';
    cm.token = j.nextPageToken || '';
    if (cm.token) { const b = document.createElement('button'); b.className = 'chip more'; b.textContent = 'もっと見る'; b.onclick = () => loadComments(true); box.append(b); }
  } catch (e) { box.textContent = 'コメントを取得できませんでした：' + e.message; }
}
async function loadReplies(btn, token) {
  const holder = btn.nextElementSibling;
  btn.disabled = true;
  try {
    const j = await api('comments', {part:'snippet', parentId:btn.dataset.rp, maxResults:100, textFormat:'plainText', ...(token ? {pageToken:token} : {})});
    holder.querySelector('.rmore')?.remove();
    (j.items || []).forEach(x => {
      const c = x.snippet, d = document.createElement('div'); d.className = 'cmt rep';
      d.innerHTML = `<b>${esc(c.authorDisplayName)}</b><span>${esc((c.publishedAt || '').slice(0, 10))}　♥${c.likeCount || 0}</span><p>${esc(c.textDisplay)}</p>`;
      holder.append(d);
    });
    if (j.nextPageToken) { const b = document.createElement('button'); b.className = 'chip rmore'; b.textContent = 'もっと見る'; b.onclick = () => loadReplies(btn, j.nextPageToken); holder.append(b); }
    btn.dataset.loaded = '1'; btn.textContent = '返信を閉じる';
  } catch (e) { holder.textContent = '返信を取得できませんでした：' + e.message; }
  btn.disabled = false;
}
function toggleReplies(btn) {
  if (!btn.dataset.loaded) { loadReplies(btn); return; }
  const h = btn.nextElementSibling; h.hidden = !h.hidden;
  btn.textContent = h.hidden ? btn.dataset.label : '返信を閉じる';
}
function openComments(id) {
  cm.id = id; cm.sort = 'relevance';
  document.querySelectorAll('#cmDlg [data-s]').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === 'relevance'));
  $('#cmDlg').showModal(); loadComments(false);
}
$('#cmDlg').addEventListener('click', e => {
  if (e.target.dataset?.rp) { toggleReplies(e.target); return; }
  const t = e.target.dataset?.s;
  if (t) { cm.sort = t; document.querySelectorAll('#cmDlg [data-s]').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === t)); loadComments(false); }
  if (e.target.id === 'cmClose') $('#cmDlg').close();
});
$('#qForm').addEventListener('submit', e => {
  if (e.submitter?.value !== 'ok') return;
  const v = $('#qVal').value.trim(); if (!v) return;
  st.q = v; st.only = ''; st.onlyLabel = ''; $('#qVal').value = ''; wr('st', st); bar(); load();
});

bar(); load();
</script>
